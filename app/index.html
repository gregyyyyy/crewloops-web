<script>
// Short link to share (WhatsApp, QR codes, business cards): shows a clean preview with the logo,
// then sends each device to the right store. While a store link is empty, the visitor lands on the website.
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6827033497';
  var PLAY_STORE = '';    // once live: 'https://play.google.com/store/apps/details?id=com.crewloops.app'
  var SITE = 'https://crewloops.com/';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  location.replace((ios && APP_STORE) || (android && PLAY_STORE) || SITE);
})();
</script>
